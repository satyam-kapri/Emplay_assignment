[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-intelligence"
version = "0.1.0"
description = "Evidence-grounded hybrid search and multi-agent RFP extraction"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "pdfplumber>=0.11,<1", "beautifulsoup4>=4.12,<5", "numpy>=1.26,<3", "sentence-transformers>=3,<7", "qdrant-client>=1.12,<2", "rank-bm25>=0.2.2,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rfp = "rfp_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["rfp_intelligence*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
